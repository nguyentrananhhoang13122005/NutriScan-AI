name: CI - Quality Gate & Bundle Verification

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-security:
    name: TypeScript & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriscan-app

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Secret .env is Not Tracked
        run: |
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "❌ ERROR: Secret .env file must not be tracked in Git!"
            exit 1
          fi
          echo "✅ Security check passed: .env is not tracked."

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutriscan-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run typecheck

  bundle-verification:
    name: Metro Bundle & Web Export Check
    needs: typecheck-and-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriscan-app

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutriscan-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Export Expo Bundle (Web)
        env:
          EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_AI_PROVIDER || 'OPENAI' }}
        run: npm run export:web

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutriscan-web-bundle
          path: nutriscan-app/dist
          retention-days: 7

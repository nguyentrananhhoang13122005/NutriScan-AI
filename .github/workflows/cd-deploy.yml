name: CD - Expo OTA Update & Web Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-web-release:
    name: Build Production Web Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriscan-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutriscan-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Verification
        run: npm run typecheck

      - name: Build Expo Web Production Bundle
        env:
          EXPO_PUBLIC_API_PROXY_URL: ${{ secrets.EXPO_PUBLIC_API_PROXY_URL || 'https://nutriscan-ai-nutriscan-proxy.vercel.app/api/analyze' }}
          EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_AI_PROVIDER || 'OPENAI' }}
        run: npm run export:web

      - name: Upload Production Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutriscan-production-web
          path: nutriscan-app/dist
          retention-days: 14

  eas-ota-update:
    name: Publish Expo EAS OTA Update (Optional)
    needs: build-web-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriscan-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check if EXPO_TOKEN is configured
        if: env.EXPO_TOKEN == ''
        run: echo "ℹ️ EXPO_TOKEN secret is not set on GitHub yet. Skipping automatic EAS OTA update."

      - name: Checkout Repository
        if: env.EXPO_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        if: env.EXPO_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutriscan-app/package-lock.json

      - name: Setup Expo & EAS CLI
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        if: env.EXPO_TOKEN != ''
        run: npm ci

      - name: Publish EAS Update
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_PUBLIC_API_PROXY_URL: ${{ secrets.EXPO_PUBLIC_API_PROXY_URL || 'https://nutriscan-ai-nutriscan-proxy.vercel.app/api/analyze' }}
          EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_AI_PROVIDER || 'OPENAI' }}
        run: eas update --auto --non-interactive

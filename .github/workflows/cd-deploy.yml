name: CD - Expo OTA Update & Web Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web-release:
    name: Build Production Web Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriscan-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutriscan-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Verification
        run: npm run typecheck

      - name: Build Expo Web Production Bundle
        env:
          EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_AI_PROVIDER || 'OPENAI' }}
          EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: npm run export:web

      - name: Upload Production Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutriscan-production-web
          path: nutriscan-app/dist
          retention-days: 14

  eas-ota-update:
    name: Publish Expo EAS OTA Update
    needs: build-web-release
    if: ${{ secrets.EXPO_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriscan-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutriscan-app/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Publish EAS Update
        env:
          EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_AI_PROVIDER || 'OPENAI' }}
          EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: eas update --auto --non-interactive


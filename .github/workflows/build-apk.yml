name: Build Android APK (EAS Cloud)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview generates installable .apk)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-android-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nutriscan-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutriscan-app/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Trigger EAS Android APK Build
        env:
          EXPO_PUBLIC_API_PROXY_URL: ${{ secrets.EXPO_PUBLIC_API_PROXY_URL }}
          EXPO_PUBLIC_AI_PROVIDER: ${{ secrets.EXPO_PUBLIC_AI_PROVIDER || 'OPENAI' }}
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
